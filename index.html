
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Network Krypto AI</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #080812;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 20px;
  display: flex;
  justify-content: space-between;
  border-bottom: 1px solid #29243d;
}

.logo {
  color: #a78bfa;
  font-weight: bold;
  font-size: 20px;
}

button {
  background: #7545df;
  color: white;
  padding: 12px 18px;
  border: 0;
  border-radius: 8px;
  margin: 5px;
  cursor: pointer;
}

button:hover { background: #956bff; }

.hero {
  text-align: center;
  padding: 65px 15px;
}

.hero h1 { font-size: 38px; }
.hero span { color: #a78bfa; }
.hero p { color: #aaa; }

.panel {
  max-width: 390px;
  margin: 20px auto;
  padding: 25px;
  background: #141424;
  border: 1px solid #493477;
  border-radius: 14px;
  text-align: center;
}

input {
  width: 100%;
  padding: 13px;
  margin: 8px 0;
  background: #090916;
  color: white;
  border: 1px solid #39305e;
  border-radius: 8px;
}

#dashboard { display: none; }
#message { overflow-wrap: anywhere; color: #c4b5fd; }
footer { text-align: center; padding: 30px; color: #777; }
</style>
</head>

<body>

<header>
  <div class="logo">NETWORK KRYPTO AI</div>
  <button onclick="showAuth()">Sign In</button>
</header>

<section class="hero">
  <h1>Meet <span>Network Krypto AI</span></h1>
  <p>Your AI assistant for coding, Minecraft and Discord.</p>
  <button onclick="showAuth()">Get Started</button>
</section>

<div class="panel" id="auth">
  <h2>Welcome to Krypto</h2>

  <input id="email" type="email" placeholder="Email address">
  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">Login</button>
  <button onclick="register()">Create Account</button>
  <button onclick="googleLogin()">Google Login</button>

  <p id="message"></p>
</div>

<div class="panel" id="dashboard">
  <h2>Welcome to Network Krypto AI!</h2>
  <p id="userEmail"></p>
  <button onclick="logout()">Logout</button>
</div>

<footer>
  Network Krypto AI © 2026
</footer>

<script type="module">
import { auth, googleProvider } from "./firebase.js";

import {
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

const email = document.getElementById("email");
const password = document.getElementById("password");
const message = document.getElementById("message");

window.login = async () => {
  try {
    await signInWithEmailAndPassword(
      auth, email.value, password.value
    );
    message.textContent = "Login successful!";
  } catch (error) {
    message.textContent = error.message;
  }
};

window.register = async () => {
  try {
    await createUserWithEmailAndPassword(
      auth, email.value, password.value
    );
    message.textContent = "Account created!";
  } catch (error) {
    message.textContent = error.message;
  }
};

window.googleLogin = async () => {
  try {
    await signInWithPopup(auth, googleProvider);
  } catch (error) {
    message.textContent = error.message;
  }
};

window.logout = async () => {
  await signOut(auth);
};

window.showAuth = () => {
  document.getElementById("auth").scrollIntoView({
    behavior: "smooth"
  });
};

onAuthStateChanged(auth, user => {
  document.getElementById("auth").style.display =
    user ? "none" : "block";

  document.getElementById("dashboard").style.display =
    user ? "block" : "none";

  if (user) {
    document.getElementById("userEmail").textContent =
      user.email || "Google user";
  }
});
</script>

</body>
</html>
