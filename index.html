
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101322">
  <title>Network Krypto AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>Network Krypto AI</h1>
      <p>Your AI coding developer</p>
    </header>

    <section id="chat">
      <div class="message">
        Hello! I'm Network Krypto AI.
        What are we building today?
      </div>
    </section>

    <form id="chat-form">
      <input
        id="user-input"
        type="text"
        placeholder="Ask me to code something..."
        autocomplete="off"
        required
      >
      <button type="submit">Send</button>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
